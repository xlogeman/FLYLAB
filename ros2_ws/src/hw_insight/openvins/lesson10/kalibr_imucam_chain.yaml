%YAML:1.0

# ==================================================================
# OpenVINS 传感器链配置文件 (针对 AirSim 双目仿真环境)
# ==================================================================

# 这里的 cam0, cam1 顺序必须与后续 estimator_config.yaml 中定义的顺序一致
cam0:
  # 【外参矩阵】 T_imu_cam (即从相机坐标系到 IMU 坐标系的变换)
  # 包含 R_c2i (旋转) 和 p_cinI (平移)
  # 直接沿用 VINS-Fusion 的 body_T_cam0 矩阵
  T_imu_cam: 
    - [ 0.0, -0.6, 0.8,  0.4 ]  # 第一行：旋转的前三项 + X轴偏移(0.4m)
    - [ 1.0,  0.0, 0.0, -0.08]  # 第二行：旋转的前三项 + Y轴偏移(-0.08m，即左移8cm)
    - [ 0.0,  0.8, 0.6,  0.00]  # 第三行：旋转的前三项 + Z轴偏移
    - [ 0.0,  0.0, 0.0,  1.0 ]  # 第四行：齐次坐标固定值

  # 【重叠描述】 告诉前端：本相机与索引为 1 的相机（cam1）有视野重合
  # 这是实现双目约束（Stereo Constraint）的核心配置
  cam_overlaps: [1]

  # 【相机模型】 AirSim 默认是针孔模型 (pinhole)
  camera_model: pinhole

  # 【畸变模型】 AirSim 是完美仿真，没有透镜畸变，选 radtan (径向切向)
  distortion_model: radtan

  # 【畸变系数】 [k1, k2, p1, p2] 
  # 因为是仿真，所以全部设为 0.0
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]

  # 【相机内参】 格式为: [fu, fv, cu, cv] (焦距x, 焦距y, 主点x, 主点y)
  # 基于 400x300 分辨率和 90度 FOV 计算得出
  intrinsics: [200.0, 200.0, 200.0, 150.0]

  # 【分辨率】 必须与 AirSim 配置文件中的 Width/Height 严格一致
  resolution: [400, 300]

  # 【ROS话题】 该相机图像发布的 ROS Topic 名字
  rostopic: "/airsim/left_cam/image_raw"

  # 【硬件时延】 相机触发相对于 IMU 时间戳的偏移 (单位: 秒)
  # AirSim 时间戳是完美的，设为 0
  timeshift_cam_imu: 0.0

cam1:
  # 右相机的外参：旋转与左边一致，Y轴平移变为 +0.08 (即右移8cm)
  T_imu_cam: 
    - [ 0.0, -0.6, 0.8,  0.4 ]
    - [ 1.0,  0.0, 0.0,  0.08]
    - [ 0.0,  0.8, 0.6,  0.00]
    - [ 0.0,  0.0, 0.0,  1.0 ]

  # 告诉前端：本相机与索引为 0 的相机（cam0）有视野重合
  cam_overlaps: [0]

  camera_model: pinhole
  distortion_model: radtan
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
  intrinsics: [200.0, 200.0, 200.0, 150.0]
  resolution: [400, 300]
  rostopic: "/airsim/right_cam/image_raw"
  timeshift_cam_imu: 0.0
