%YAML:1.0
---
# 定义模型的类型为MEI（Mixed Excitation Model），用于表示相机的投影模型
model_type: PINHOLE 
camera_name: camera
image_width: 400
image_height: 300


# 畸变参数，用于校正径向和切向畸变
distortion_parameters:
   k1: 0
   k2: 0
   p1: 0
   p2: 0


# 投影参数，用于将3D点投影到图像平面
projection_parameters:
   fx: 200
   fy: 200
   cx: 200
   cy: 150

