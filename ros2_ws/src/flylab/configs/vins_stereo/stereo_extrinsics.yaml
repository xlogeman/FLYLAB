%YAML:1.0

# ===============================================
# 1. 传感器与系统配置
# ===============================================
# 1个IMU和1个摄像头；1个IMU和2个摄像头：2个摄像头
imu: 1                   # 启用IMU数量 (0或1)
num_of_cam: 2            # 启用相机数量 (1为单目, 2为双目)
multiple_thread: 1       # 启用多线程支持 (1为开启，提升实时性)

# ===============================================
# 2. ROS 话题与文件路径
# ===============================================
imu_topic: "/airsim_node/PX4/imu/Imu"                 # IMU 数据订阅话题
image0_topic: "/airsim_node/PX4/left_cam/Scene"       # 左相机图像订阅话题
image1_topic: "/airsim_node/PX4/right_cam/Scene"      # 右相机图像订阅话题
output_path: "/root/fucker/ros2_ws/src/vins/log/"    # VINS运行日志及结果输出路径

# ===============================================
# 3. 相机内参与分辨率
# ===============================================
cam0_calib: "stereo_intrinsics.yaml"   # 左相机内参配置文件路径
cam1_calib: "stereo_intrinsics.yaml"   # 右相机内参配置文件路径
image_width: 400                           # 图像分辨率 宽
image_height: 300                          # 图像分辨率 高

# ===============================================
# 4. 相机到机身(IMU)的外参矩阵 (T_cam_to_body)
# ===============================================
# estimate_extrinsic 参数说明:
# 0: 外参完全准确，锁定下方矩阵，不进行在线优化
# 1: 外参为初步估计值，系统将在此基础上进行在线微调优化
# 2: 无外参先验，无需提供下方矩阵，系统将在起飞初始运动时自动标定
estimate_extrinsic: 0

# 左相机外参 (cam0)
# 旋转含义: 相机Z轴对齐机身X轴，相机X轴对齐机身Y轴，相机Y轴对齐机身Z轴 (NED坐标系)
# 平移含义: 相对于机身原点，左相机向前平移 0.33m，向左平移 0.05m (机身Y向右为正，故向左为-0.05)
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.0,-0.6, 0.8,  0.4,
           1.0, 0.0, 0.0, -0.08,
           0.0, 0.8, 0.6,  0.00,
           0.0, 0.0, 0.0,  1.00 ]

# 右相机外参 (cam1)
# 旋转含义: 与左相机姿态完全一致
# 平移含义: 相对于机身原点，右相机向前平移 0.33m，向右平移 0.05m
body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.0,-0.6, 0.8,  0.4,
           1.0, 0.0, 0.0,  0.08,
           0.0, 0.8, 0.6,  0.00,
           0.0, 0.0, 0.0,  1.00 ]

# ===============================================
# 5. 特征提取与光流跟踪参数
# ===============================================
max_cnt: 200            # 每帧提取的最大特征点数量
min_dist: 10            # 两个特征点之间的最小像素距离 (防止特征点扎堆)
freq: 10                # 发布视觉里程计结果的频率 (Hz)。设置为0代表与相机帧率同步
F_threshold: 1.0        # RANSAC 算法剔除外点的像素误差阈值
show_track: 1           # 是否在ROS主题中发布带有特征点轨迹的可视化图像 (1开启, 0关闭)
flow_back: 0            # 是否开启双向光流跟踪 (开启后精度更高，但更吃算力)

# ===============================================
# 6. 后端非线性优化参数
# ===============================================
max_solver_time: 0.04   # 求解器单次优化的最大耗时限制 (单位:秒)，保证系统实时性不卡顿
max_num_iterations: 8   # 求解器的最大迭代次数
keyframe_parallax: 10.0 # 触发产生新关键帧的视差阈值 (像素)

# ===============================================
# 7. IMU 噪声参数 (极大影响系统鲁棒性)
# ===============================================
# 注意：以下越贴近真实传感器标定值，VINS表现越好
acc_n: 0.06         # 加速度计白噪声 (m/s^2)   0.07
gyr_n: 0.086          # 陀螺仪白噪声 (rad/s)  0.1
acc_w: 0.00086        # 加速度计零偏随机游走噪声 (m/s^3)  0.001
gyr_w: 0.000086       # 陀螺仪零偏随机游走噪声 (rad/s^2)   0.0001
g_norm: 9.806650161743164      # 仿真环境或当地的重力加速度常数

# ===============================================
# 8. 时间同步参数
# ===============================================
estimate_td: 0       # 是否在线自动估算并修正相机与IMU之间的时间偏移 (0关闭, 1开启)
td: 0             # 时间偏移初始先验值 (单位:秒)。公式：图像时间 + td = IMU时间

# ===============================================
# 9. 回环检测与位姿图参数 (Pose Graph)
# ===============================================
load_previous_pose_graph: 0  # 启动时是否加载历史位姿图 (用于多架次建图或重定位)
pose_graph_save_path: "/root/fucker/ros2_ws/src/vins/log/pose_graph/"  # 位姿图保存路径
save_image: 0                # 是否将关键帧图像存入位姿图 (设为0可大幅减小内存占用，但无法进行视觉回环验证)

