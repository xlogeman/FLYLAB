# ArUco 检测 / 视觉降落参数配置 —— 改这里，不用动代码、不用改地面站。
#
# 用法: 节点启动时加 --ros-args --params-file <本文件路径>
#   - 地面站已在 flylab_gcs/config.py 中默认携带本文件 (ArUco检测按钮 + 降落按钮)
#   - 命令行 -p 的优先级高于本文件, 可临时覆盖单项, 如:
#     ros2 run flylab_vision aruco_landing_node --ros-args --params-file <本文件> \
#         -p dict_name:=DICT_6X6_250 -p target_id:=92
#
# /**: 通配所有节点名 (aruco_detector / aruco_landing_node),
#      各节点只取自己声明的参数, 其余自动忽略, 因此两个节点可共用本文件。
/**:
  ros__parameters:
    # ---------- 检测参数 (aruco_node / aruco_landing_node 共用) ----------
    image_topic: /flylab/display/image_raw   # 算法图像输入 (默认地面站转发帧)
    dict_name: DICT_4X4_1000                 # 字典; Prometheus 6x6 码用 DICT_6X6_250
    dict_topic: /flylab/aruco_dict           # 地面站"ArUco 字典"下拉运行中同步 (latched)
    marker_length: 0.8                       # 码物理边长 (米), 影响 3D 位姿解算尺度
    fov_deg: 90.0                            # 初始视场角估算 (无标定时); 地面站调整 FOV 滑杆后经 /flylab/camera_fov 自动同步覆盖
    calib: ""                                # 相机标定 yaml 路径; 空 = 按 FOV 估算 (位姿仅供参考)
    marker_length_topic: /flylab/aruco_marker_length  # 地面站"码边长"滑杆运行中同步 (latched, 后启动节点也收到)
    annotation_topic: /flylab/annotations    # 标注输出话题

    # ---------- 降落参数 (仅 aruco_landing_node, 检测节点忽略) ----------
    cmd_topic: /flylab/vision_cmd            # 启停指令话题
    status_topic: /flylab/landing_status     # 状态回传话题 (tracking/landing/landed/idle)
    link: mavros                             # PX4 执行链路: mavros | uxrce
    gimbal_topic: /flylab/gimbal_state       # 云台姿态话题 (必需, 断流则悬停等待)
    gimbal_timeout_sec: 0.5                  # 云台数据超时 (s)

    # 目标选择 (多尺度嵌套码)
    target_id: 41                            # 精准落点码 ID; -1 = 任一 (画面最大并锁定)
    target_fallback: true                    # 指定 ID 不可见时回退跟踪画面最大码

    # 水平对齐
    land_cx: 0.5                             # 期望对中的画面位置 (归一化)
    land_cy: 0.5
    vel_gain: 1.0                            # 水平对齐 P 增益
    max_h_vel: 1.2                           # 水平速度限幅 (m/s)
    align_ref_alt: 2.5                       # 高度增益缩放基准高度 (m, 0=禁用)
    max_height_scale: 3.0                    # 高度缩放上限

    # 降落朝向对齐 (云台 → 码 0° 方向 + 偏置, 地面站右栏可运行中改偏置):
    # 全程并行不等水平对齐: 云台对准码 0° 方向 (角点 0→1) + 偏置, 对准后
    # 码 0° 方向停在屏幕上方偏右 yaw_offset 处; 机头经跟随通道同步追随云台,
    # 双对齐连续 N 帧锁定航向 (对齐期间下降受航向门控平滑压低)
    gimbal_cmd_topic: /flylab/gimbal_cmd     # 算法云台指令 [yaw_rate, pitch_rate] (°/s)
    yaw_align: true                          # 关闭则对齐达标后直接调速下降 (不转云台)
    yaw_offset_deg: 0.0                      # 对准后码 0° 方向相对屏幕上方的偏置 (度, 右正)
    yaw_tol_deg: 1.0                         # 云台对准锁定容差 (度)
    yaw_gain: 3.0                            # 云台偏航 P 增益 (°/s 每度偏差)
    yaw_rate_max_deg: 45.0                   # 云台偏航角速率限幅 (°/s, 须 < GIMBAL_JOY_RATE_DEG_S=60)
    min_yaw_frames: 5                        # 双对齐连续达标帧数 (20Hz, 0.25s)
    yaw_timeout_sec: 30.0                    # 对齐悬置超时 (s, 超时按当前朝向继续下降; 0=不超时)
    yaw_offset_topic: /flylab/landing_yaw_offset  # 地面站朝向选择同步 (latched)

    # 机头跟随云台 (对齐期间): 请求相机侧反卷 + 订阅反卷误差注入偏航角速率
    follow_req_topic: /flylab/gimbal_follow  # 跟随请求 (Bool, 开相机侧反卷)
    follow_err_topic: /flylab/gimbal_yaw_err # 跟随误差广播 (反卷后的云台偏航, latched)
    follow_kp: 1.2                           # 跟随 P 增益 (°/s 每度误差, 与地面站 GIMBAL_FOLLOW_KP 一致)
    follow_tol_deg: 5.0                      # 机头跟上云台的容差 (度)
    follow_rate_max_deg: 45.0                # 跟随偏航角速率限幅 (°/s)
    follow_fresh_sec: 1.5                    # 误差新鲜度上限 (s, 地面站 1s 保活 + 裕量)

    # 下降速度调度 (全并行耦合: 对中/下降/朝向对齐同时输出,
    # 下降 = 面积调度 × 对齐门控 × 航向门控, 门控误差超容差线性衰减到 0)
    align_gate_width: 0.15                   # 对齐门控斜坡宽度 (归一化误差): 误差超出 align_tol 后下降线性衰减到 0
    yaw_gate_width: 15.0                     # 航向门控斜坡宽度 (度): 云台/跟随偏差超出 yaw_tol 后下降线性衰减到 0
    floor_alt: 1.0                           # 近地高度下限 (m): 低于此高度且航向未锁定时停降; 0=禁用
    descend_close: 0.3                       # 近处下降速度 (m/s, 正值=向下)
    descend_far: 0.5                         # 远处下降速度 (m/s)
    area_s_thresh: 0.85                      # 速度调度分段点

    # 切 AUTO.LAND 触发: 对齐 + 面积 + 趋势角, 连续 N 帧确认
    align_tol: 0.06                          # 对齐容差 (归一化画面)
    land_area_thresh: 0.12                   # 面积阈值 (足够近)
    vertical_threshold_deg: 15.0             # 降落趋势角门限 (度)
    min_landing_frames: 4                    # 条件连续满足帧数
    angle_window_min: 5                      # 趋势角滑动窗口下限 (帧)
    angle_window_max: 50                     # 趋势角滑动窗口上限 (帧)

    # 3D 位姿降落模式 (地面站"接管控制→视觉反控→3D 姿态"即以 landing_mode:=pose3d
    # 启动; 位姿尺度可信时用 —— tvec 经云台姿态旋到机体系, 米级闭环:
    #   水平: 速度 = pose_h_gain × 米级偏移 (限幅 max_h_vel, 无需面积/高度缩放)
    #   下降: 速度 = pose_descend_gain × 离码高度, 夹在 [min,max] 后乘
    #         对齐门控 (pose_gate_width 斜坡) × 航向门控
    #   触发: 水平误差 < pose_align_tol 且 离码高度 <= pose_land_alt 且
    #         趋势角/航向条件与 image 模式相同, 连续 min_landing_frames 帧
    landing_mode: image                      # image = 图像空间伺服 | pose3d = 3D 位姿闭环
    pose_h_gain: 0.8                         # 水平 P 增益 (1/s, 误差收敛时间常数倒数)
    pose_descend_gain: 0.15                  # 下降 P 增益 (1/s)
    pose_descend_max: 1.0                    # 下降速度上限 (m/s)
    pose_descend_min: 0.2                    # 下降速度下限 (m/s, 保证低空下降进度)
    pose_align_tol: 0.20                     # 水平对齐容差 (m)
    pose_gate_width: 0.50                    # 对齐门控斜坡宽度 (m)
    pose_land_alt: 1.5                       # 切 AUTO.LAND 的离码高度 (m)
    pose_filter_alpha: 0.25                  # 落点估计 EMA 系数 (0~1, 越小越平滑; 码固定于世界, 滤波合法)
    pose_outlier_m: 1.5                      # 落点估计野值剔除门限 (m, 单帧跳变超限保旧值)
    cam_offset_fwd: 0.0                      # 云台支点相对机体中心的安装偏置 (机体系
    cam_offset_right: 0.0                    #   FRD, m; 支点在旋转中心时全 0,
    cam_offset_down: 0.0                     #   AirSim 云台默认在机体原点)

    # 异常处理与 offboard 时序
    lost_timeout_sec: 8.0                    # 目标丢失超时 (s), 超时切 AUTO_LOITER 交还控制权
    reacquire_sec: 0.5                       # 锁定 ID 持续丢失多久后重新选目标 (s)
    offboard_warmup_sec: 1.0                 # offboard 心跳预热 (s)
    offboard_retry_sec: 10.0                 # offboard 接管失败重试时长 (s)
    control_hz: 20.0                         # 控制主循环频率 (Hz)
