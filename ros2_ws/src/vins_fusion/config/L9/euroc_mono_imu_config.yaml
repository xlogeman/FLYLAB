%YAML:1.0

# 通用参数
# 支持：1个IMU和1个摄像头；1个IMU和2个摄像头：2个摄像头；
imu: 1         # IMU数量
num_of_cam: 1  # 摄像头数量

imu_topic: "/L9/imu"  # IMU数据主题
image0_topic: "/L9/flir"  # 第一个摄像头图像数据主题 
gnss_topic: "/L9/gnss"  # GNSS数据主题
uwb_topic: "/L9/uwb_range_pos"  # UWB数据主题
output_path: "/media/l/E/vinsfusion/vinsfusion_ros1_gps_0909/output/L9/"  # 输出路径

# UWB功能开关
use_uwb: 0  # 0-不使用UWB信息，1-使用UWB信息

cam0_calib: "cam0_mei.yaml"  # 第一个摄像头的校准文件
image_width: 1280  # 图像宽度
image_height: 1024  # 图像高度

# IMU和摄像头之间的外参。
estimate_extrinsic: 0   # 0  拥有准确的外参。我们将信任以下imu^R_cam, imu^T_cam，不要改变它。
                        # 1  对外参有初步估计。我们将在您的初步估计周围进行优化。
                        # 2  Don't know anything about extrinsic parameters. You don't need to give R,T. We will try to calibrate it. Do some rotation movement at beginning. 


body_T_cam0: !!opencv-matrix  # IMU到摄像头的变换矩阵
   rows: 4
   cols: 4
   dt: d
#    data:  [-0.9999724941691212, -0.0020480487757582383, -0.007128562365397786, -0.03495817880634375,
#            0.0021526326410309738, -0.9998897131105472, -0.01469448156345723, -0.011122086411067399,
#            -0.007097681163451802, -0.014709422555563885, 0.9998666190098469, -0.0926101995904657,
#            0, 0, 0, 1]
   data:  [-0.9999724941691212,0.0021526326410309738,-0.007097681163451802, -0.03495817880634375,
           -0.0020480487757582383, -0.9998897131105472, -0.014709422555563885, -0.011122086411067399,
           -0.007128562365397786, -0.01469448156345723, 0.9998666190098469, 0.0926101995904657,
           0, 0, 0, 1]


# 多线程支持
multiple_thread: 1

# 特征跟踪参数
max_cnt: 150            # 特征跟踪中最大特征数量
min_dist: 30            # 两个特征之间的最小距离 
freq: 10                # 发布跟踪结果的频率（Hz）。至少10Hz才能获得良好的估计。如果设置为0，频率将与原始图像相同
F_threshold: 1.0        # RANSAC阈值（像素）
show_track: 1           # 以主题形式发布跟踪图像
flow_back: 1            # 执行前向和后向光流以提高特征跟踪精度

# 优化参数
max_solver_time: 0.04  # 最大求解迭代时间（ms），以保证实时性
max_num_iterations: 8   # 最大求解迭代次数，以保证实时性
keyframe_parallax: 10.0 # 关键帧选择阈值（像素）

# IMU参数       提供的参数越准确，性能越好
acc_n: 6.6848772813371373e-02          # 加速度计测量噪声的标准差，用于模拟加速度计读数的误差，（m/s²）
gyr_n: 8.7510201471946162e-04        # 陀螺仪测量噪声的标准差，用于模拟陀螺仪读数的误差，（rad/s）
acc_w: 3.4118090066874175e-03         # 加速度计偏差随机游走噪声的标准差，用于模拟加速度计长期使用的偏差变化，（ug，即微重力加速度，1ug = 1 × 10⁻⁶ g）
gyr_w: 4.0083425496425443e-05       # 陀螺仪偏差随机游走噪声的标准差，用于模拟陀螺仪长期使用的偏差变化，（deg/h）
g_norm: 9.81007     # 重力大小

# acc_n: 1          # accelerometer measurement noise standard deviation. 
# gyr_n: 0.1        # gyroscope measurement noise standard deviation.     
# acc_w: 0.01        # accelerometer bias random work noise standard deviation.  
# gyr_w: 0.001       # gyroscope bias random work noise standard deviation.     
# g_norm: 9.81007     # gravity magnitude

# 非同步参数
estimate_td: 1                      # 在线估计摄像头和IMU之间的时间偏移
td: 0.0                             # 时间偏移的初始值。单位：秒。读取的图像时钟 + td = 实际图像时钟（IMU时钟）

# 回环闭合参数
load_previous_pose_graph: 1       # 加载和重用以前的姿态图；从'pose_graph_save_path'加载
pose_graph_save_path: "/media/l/E/vinsfusion/vinsfusion_ros1_gps_0909/output/L9/pose_graph/" # 保存和加载路径
save_image: 0                   # 保存图像到姿态图以供可视化使用；可以通过设置为0来关闭此功能